<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>CSS Meme Slider</title>
</head>

<body>
    <main class="container">
        <div class="slider">
            <input type="radio" name="slider" id="slide1" checked>
            <input type="radio" name="slider" id="slide2">
            <input type="radio" name="slider" id="slide3">
            <input type="radio" name="slider" id="slide4">
            <div class="slider-top">
                <div class="slides">
                    <div class="slide">
                        <img src="./assets/meme01.jpg" alt="Meme 1">
                    </div>
                    <div class="slide">
                        <img src="./assets/meme02.jpg" alt="Meme 2">
                    </div>
                    <div class="slide">
                        <img src="./assets/meme03.jpg" alt="Meme 3">
                    </div>
                    <div class="slide">
                        <img src="./assets/meme04.jpg" alt="Meme 4">
                    </div>
                </div>
            </div>
            <div class="slider-bottom">
                <div class="captions">
                    <h3 class="caption">Title Slide 1</h3>
                    <h3 class="caption">Title Slide 2</h3>
                    <h3 class="caption">Title Slide 3</h3>
                    <h3 class="caption">Title Slide 4</h3>
                </div>
                <div class="controls">
                    <label for="slide1"><span></span></label>
                    <label for="slide2"><span></span></label>
                    <label for="slide3"><span></span></label>
                    <label for="slide4"><span></span></label>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
