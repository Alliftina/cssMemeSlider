<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    <div class="slider">

  <input type="radio" name="slider" id="slide1" checked>
  <input type="radio" name="slider" id="slide2">
  <input type="radio" name="slider" id="slide3">
  <input type="radio" name="slider" id="slide4">

  <div class="slides">

    <div class="slide">
      <img src="./assets/meme-01.jpg" alt="Meme 1">
    </div>

    <div class="slide">
      <img src="./assets/meme-02.jpg" alt="Meme 2">
    </div>

    <div class="slide">
      <img src="./assets/meme-03.jpg" alt="Meme 3">
    </div>

    <div class="slide">
      <img src="./assets/meme-04.jpg" alt="Meme 4">
    </div>

  </div>

</div>
</body>
</html>
